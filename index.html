<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Hunter | صياد الأرقام</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <span class="icon">🎯</span>
                <h1>SMS Hunter</h1>
            </div>
            <div class="status">
                <span class="pulse"></span>
                <span id="refresh-status">متصل وجاري البحث...</span>
            </div>
        </header>

        <main>
            <section class="numbers-section">
                <div class="section-header">
                    <h2>الأرقام المتاحة</h2>
                    <button id="refresh-numbers" class="btn-secondary">تحديث القائمة</button>
                </div>
                <div id="numbers-grid" class="grid">
                    <!-- Numbers will be loaded here -->
                    <div class="loading">جاري تحميل الأرقام...</div>
                </div>
            </section>

            <section id="messages-section" class="messages-section hidden">
                <div class="section-header">
                    <div class="active-number-info">
                        <h2>الرسائل الوصلة لرقم: <span id="current-number">---</span></h2>
                    </div>
                    <div class="controls">
                        <label class="switch">
                            <input type="checkbox" id="auto-refresh" checked>
                            <span class="slider round"></span>
                        </label>
                        <span>تحديث تلقائي</span>
                        <button id="close-messages" class="btn-close">×</button>
                    </div>
                </div>
                <div id="messages-list" class="messages-list">
                    <!-- Messages will be loaded here -->
                    <div class="empty-state">اختر رقماً لعرض الرسائل</div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
